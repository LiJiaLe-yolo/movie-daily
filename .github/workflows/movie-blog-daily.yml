name: 电影博主每日影评生成推送
on:
  schedule:
    - cron: '0 20 * * *'   # UTC21点 = 北京时间 05:00
  workflow_dispatch:

jobs:
  generate-movie-review:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Maven编译打包
        run: mvn clean package -DskipTests

      - name: 运行影评生成程序
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GIST_ID: ${{ secrets.GIST_ID }}
          FEISHU_WEBHOOK_MOVIE: ${{ secrets.FEISHU_WEBHOOK_MOVIE }}
        run: java -jar target/movie-blog-generator-1.0-SNAPSHOT-jar-with-dependencies.jar

      - name: 上传稿件产物
        uses: actions/upload-artifact@v4
        with:
          name: movie-daily-output
          path: output/
