name: 仓库保活任务
on:
  schedule:
    - cron: '0 0 15 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 执行空提交保活
        run: |
          git config --global user.name "KeepAlive‑Bot"
          git config --global user.email "bot@no‑mail.example"
          git commit --allow-empty -m "chore: repo keep‑alive"
          git push
